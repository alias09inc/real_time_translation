services:
  nms:
    image: illuspas/node-media-server
    ports:
      - "1935:1935"
      - "8001:8000"

  ws:
    build: ./services/ws
    ports:
      - "8000:8000"
    env_file: .env

  gemini:
    build: ./services/translator
    env_file: .env
    environment:
      - WS_PUBLISH_URL=http://ws:8000/publish
    depends_on:
      - ws

  deepgram:
    build: ./services/asr
    env_file: .env
    environment:
      - RTMP_URL=rtmp://nms:1935/live/zoom
      - WS_PUBLISH_URL=http://ws:8000/publish
      - TRANSLATION_API_URL=http://gemini:8000/translate
    depends_on:
      - nms
      - gemini
      - ws
